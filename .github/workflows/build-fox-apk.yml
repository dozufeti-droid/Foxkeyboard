name: Build Fox Keyboard APK

on:
  push:
    branches: [ai-translation, helakuru-style-typing, feature/google-web-translate-v2, feature/en-ko-hybrid-v5, feature/fast-one-tap-v6, feature/sinhala-quality-v6-1, feature/sinhala-reliability-v6-2, feature/premium-fast-v7, feature/conversation-memory-v8, feature/papago-korean-v9]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Helakuru-style phonetic rules
        run: bash ./gradlew testUnicodeDebugUnitTest --no-daemon

      - name: Build APK
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxkeyboardAI-debug-apk
          path: app/build/outputs/apk/unicode/debug/*.apk
